[project]
name = "go-gachi"
version = "0.1.0"
description = "Small-business ad image backend baseline."
readme = "README.md"
requires-python = ">=3.11.14,<3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "pillow>=10.0.0",
  "pydantic==2.13.4",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn==0.47.0",
]

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
  "pytest==8.3.4",
  "ruff==0.8.4",
]
frontend = [
  "httpx>=0.27.0",
  "pillow>=10.0.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.35.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
