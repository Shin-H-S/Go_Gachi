[project]
name = "go-gachi"
version = "0.1.0"
description = "Small-business ad image backend baseline."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "aioboto3>=15.5.0",
  "aiosqlite>=0.20.0",
  "alembic>=1.18.4",
  "asyncpg>=0.31.0",
  "fastapi==0.136.1",
  "httpx==0.28.1",
  "pillow>=10.0.0",
  "pydantic==2.13.4",
  "pyjwt[crypto]>=2.8.0",
  "python-dotenv>=1.0.0",
  "sqlalchemy>=2.0,<3.0",
  "streamlit>=1.35.0",
  "supabase>=2.0.0",
  "uvicorn==0.47.0",
]

[dependency-groups]
dev = [
  "pre-commit>=4.6.0",
  "pytest==8.3.4",
  "ruff==0.8.4",
]
frontend = [
  "httpx>=0.27.0",
  "pillow>=10.0.0",
  "python-dotenv>=1.0.0",
  "streamlit>=1.35.0",
  "supabase>=2.0.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의존성 주입(Depends/Query/Path/Body/Security)은 인자 기본값에서 호출하는 게
# 표준 패턴이라 B008(함수 기본값 내 함수 호출) 경고에서 제외한다.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Security",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
