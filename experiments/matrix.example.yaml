# 프롬프트 배치 테스트 매트릭스 예제.
# 실행 조합 = cases × images × repeat. 아래 예제는 6케이스 × 2이미지 × 2반복 = 24장.
# 비용 확인 후 실행되므로 부담 없이 --dry-run으로 먼저 프롬프트만 확인하세요.

run_name: prompt-baseline
repeat: 2          # 같은 조합 반복 횟수 — 편차(variance) 확인용
concurrency: 4     # 동시 API 호출 수
quality: low       # 구도/준수 테스트는 low로 싸게, 최종 검증만 medium/high

# 전역 로고 (케이스에서 logo: true로 참조). 실제 가게 로고 파일로 교체하세요.
logo: frontend/assets/instagram.png

images:            # 테스트할 메뉴 사진들 (레포 루트 기준 경로)
  - path: backend/uploads/20260608_145021_bb5adc.jpg
  - path: backend/uploads/20260608_151910_ea208c.jpg

cases:
  # ── kind: system — 채널 시스템 프롬프트 자체를 비교 ─────────────────
  - id: insta-square-base
    kind: system
    preset: instagram
    detail: square_feed

  - id: insta-square-warm-tone
    kind: system
    preset: instagram
    detail: square_feed
    # 기존 시스템 프롬프트 뒤에 한 줄 추가해서 효과 비교
    system_append: "Use a warm afternoon cafe tone with soft golden lighting."

  # ── kind: logo — 로고 위치/적용 프롬프트 테스트 ─────────────────────
  - id: insta-logo-top-right
    kind: logo
    preset: instagram
    detail: square_feed
    logo: true               # 전역 logo 사용 (개별 경로도 가능)
    logo_position: top_right

  - id: insta-logo-bottom-left
    kind: logo
    preset: instagram
    detail: square_feed
    logo: true
    logo_position: bottom_left

  # ── kind: copy — 광고 문구 렌더링 정확도 테스트 ─────────────────────
  - id: insta-copy-discount
    kind: copy
    preset: instagram
    detail: square_feed
    copy:
      headline: "가을 신메뉴 출시"
      subcopy: "고구마 라떼 5,500원 → 4,900원"
      cta: "이번 주말까지"

  # ── kind: user — 유저 입력 프롬프트 베리에이션 ──────────────────────
  - id: baemin-user-clean
    kind: user
    preset: baemin
    detail: solid_background
    user_prompt: "더 밝고 깔끔하게, 배달앱 썸네일에서 잘 보이게"
