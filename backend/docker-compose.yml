# Go_Gachi 백엔드용 MySQL (로컬 개발)
# 실행: backend/ 폴더에서  docker compose up -d
# 끄기: docker compose down   (데이터 유지) / docker compose down -v (데이터 삭제)
services:
  mysql:
    image: mysql:8.0
    container_name: gogachi_mysql
    restart: unless-stopped
    environment:
      # 값은 backend/.env 에서 읽어온다 (docker compose 가 자동으로 .env 를 읽음)
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?backend/.env 에 DB_PASSWORD 를 설정하세요}
      MYSQL_DATABASE: ${DB_NAME:-go_gachi}
      TZ: Asia/Seoul
    ports:
      - "3307:3306"   # 호스트 3307 → 컨테이너 3306 (기존 3306 사용 컨테이너와 충돌 회피)
    volumes:
      - gogachi_mysql_data:/var/lib/mysql

volumes:
  gogachi_mysql_data:
