# Alembic configuration. Korean explanations live in docs/ to keep this ASCII-only.

[alembic]
# Folder that holds migration scripts.
script_location = %(here)s/migrations

# Project root added to sys.path so env.py can import `backend.app.*`.
prepend_sys_path = .

# OS-agnostic path separator (works on Windows and Linux).
path_separator = os

# DB URL is injected dynamically from .env DATABASE_URL inside env.py.
# Leave this blank; never put credentials here.
sqlalchemy.url =


# Post-write hooks (auto-formatting after revision is generated). Not used.
[post_write_hooks]


# --- Logging (keep defaults) ---

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
