steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --timeout
      - "300"
      - --concurrency
      - "20"
      - --max-instances
      - "5"
      - --set-env-vars
      - APP_ENV=production,IMAGE_PROVIDER=${_IMAGE_PROVIDER},OPENAI_TEXT_MODEL=${_OPENAI_TEXT_MODEL},OPENAI_IMAGE_MODEL=${_OPENAI_IMAGE_MODEL},OPENAI_IMAGE_QUALITY=${_OPENAI_IMAGE_QUALITY}
      - --set-secrets
      - OPENAI_API_KEY=${_OPENAI_SECRET}:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA

substitutions:
  _REGION: asia-northeast3
  _REPOSITORY: cafe-ad-maker
  _SERVICE: cafe-ad-maker-v1
  _IMAGE_PROVIDER: openai
  _OPENAI_TEXT_MODEL: gpt-5
  _OPENAI_IMAGE_MODEL: gpt-image-2
  _OPENAI_IMAGE_QUALITY: medium
  _OPENAI_SECRET: OPENAI_API_KEY
