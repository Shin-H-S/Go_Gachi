name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.14"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
